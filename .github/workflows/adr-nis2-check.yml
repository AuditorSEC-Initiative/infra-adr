name: ADR NIS2 Compliance Gate

on:
  push:
    paths:
      - 'adr/**'
      - 'docs/**'
      - 'NIS2-Art21-mapping.md'
  pull_request:
    paths:
      - 'adr/**'
      - 'docs/**'
      - 'NIS2-Art21-mapping.md'

jobs:
  nis2-check:
    runs-on: ubuntu-latest
    name: NIS2 Art.21 Compliance Validation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate ADR NIS2-Art21 fields
        run: |
          FAIL=0
          FILES=$(find adr/ docs/ -name "ADR-*.md" 2>/dev/null || true)
          if [ -z "$FILES" ]; then
            echo "::warning::No ADR-*.md files found in adr/ or docs/"
            exit 0
          fi
          echo "$FILES" | while read adr; do
            echo "Checking $adr..."
            if ! grep -qi "NIS2-Art21" "$adr"; then
              echo "::error file=$adr::FAIL: $adr lacks NIS2-Art21 field"
              exit 1
            fi
            if ! grep -qi "External.IDs\|ClickUp\|CU-ADR" "$adr"; then
              echo "::error file=$adr::FAIL: $adr lacks ClickUp/External ID reference"
              exit 1
            fi
            echo "✅ $adr: NIS2 compliance fields present"
          done
          echo "✅ All ADRs passed NIS2-Art21 compliance gate"

      - name: Check NIS2-Art21-mapping exists
        run: |
          if [ ! -f "NIS2-Art21-mapping.md" ]; then
            echo "::warning::NIS2-Art21-mapping.md not found"
          else
            echo "✅ NIS2-Art21-mapping.md present"
          fi

      - name: Validate governance.yaml
        run: |
          if [ -f "governance.yaml" ]; then
            echo "✅ governance.yaml present"
          else
            echo "::warning::governance.yaml not found"
          fi

      - name: Summary
        run: |
          echo "## ADR NIS2 Compliance Gate Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Repo: AuditorSEC-Initiative/infra-adr" >> $GITHUB_STEP_SUMMARY
          echo "- Phase: UHIP-2A" >> $GITHUB_STEP_SUMMARY
          echo "- NIS2 Article 21 coverage validated" >> $GITHUB_STEP_SUMMARY
          echo "- Run: $(date -u)" >> $GITHUB_STEP_SUMMARY
