name: ADR NIS2 Compliance Gate

on:
  push:
    paths:
      - 'adr/**'
      - 'docs/**'
      - 'NIS2-Art21-mapping.md'
  pull_request:
    paths:
      - 'adr/**'
      - 'docs/**'
      - 'NIS2-Art21-mapping.md'

jobs:
  nis2-check:
    runs-on: ubuntu-latest
    name: NIS2 Art.21 Compliance Validation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate ADR NIS2-Art21 fields
        run: |
          FAIL=0
          for adr in docs/ADR-*.md adr/ADR-*.md; do
            [ -f "$adr" ] || continue
            echo "Checking $adr..."
            if ! grep -qi "NIS2-Art21" "$adr"; then
              echo "::error file=$adr::FAIL: $adr lacks NIS2-Art21 field"
              FAIL=1
            fi
            if ! grep -qi "CU-ADR\|ClickUp" "$adr"; then
              echo "::error file=$adr::FAIL: $adr lacks ClickUp/CU-ADR reference"
              FAIL=1
            fi
            echo "✅ $adr: NIS2 compliance fields present"
          done
          if [ $FAIL -ne 0 ]; then
            echo "::error::One or more ADRs failed NIS2 compliance gate"
            exit 1
          fi
          echo "✅ All ADRs passed NIS2-Art21 compliance gate"

      - name: Check NIS2-Art21-mapping
        run: |
          [ -f NIS2-Art21-mapping.md ] && echo "✅ mapping present" || echo "::warning::NIS2-Art21-mapping.md missing"

      - name: Check governance.yaml
        run: |
          [ -f governance.yaml ] && echo "✅ governance.yaml present" || echo "::warning::governance.yaml missing"

      - name: Step Summary
        run: |
          echo "## NIS2 ADR Gate | UHIP-2A | $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- Repo: AuditorSEC-Initiative/infra-adr" >> $GITHUB_STEP_SUMMARY
          echo "- All ADRs validated for NIS2-Art21 + ClickUp IDs" >> $GITHUB_STEP_SUMMARY
